<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ジョブガチャ | FFXIV</title>
<meta name="description" content="FFXIVキャラクターにランダムで戦闘ジョブを振り分けるツール">

<meta property="og:type" content="website">
<meta property="og:title" content="ジョブガチャ | FFXIV">
<meta property="og:description" content="FFXIVキャラクターにランダムで戦闘ジョブを振り分けるツール">
<meta property="og:url" content="https://edamame.tools.pisorium.com/job-gacha/">
<meta property="og:image" content="https://edamame.tools.pisorium.com/job-gacha/assets/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ジョブガチャ | FFXIV">
<meta name="twitter:description" content="FFXIVキャラクターにランダムで戦闘ジョブを振り分けるツール">
<meta name="twitter:image" content="https://edamame.tools.pisorium.com/job-gacha/assets/ogp.png">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%8E%B2%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="panel header">
    <div class="level-field">
      <label for="level-threshold" data-i18n="level.label">基準レベル</label>
      <input id="level-threshold" type="number" min="1" max="100" value="100">
      <div class="level-quick-row">
        <button type="button" class="btn-mini" data-level="1">Lv1</button>
        <button type="button" class="btn-mini" data-level="100">Lv100</button>
      </div>
      <button id="optimal-level-btn" type="button" class="btn-mini" data-i18n="level.optimalBtn">全員の最適レベル適用</button>
    </div>

    <div class="header-center">
      <a href="../" class="hub-link" data-i18n="app.hubLink">← まめツール</a>
      <h1 class="title" data-i18n="app.title">ジョブガチャ</h1>
      <div class="role-icons" id="role-icons"></div>
    </div>

    <div class="header-right">
      <button id="role-mode-toggle" class="btn btn-outline" data-i18n="role.changeBtn">構成変更</button>
      <div class="locale-switcher"></div>
    </div>
  </header>

  <div class="toolbar-row">
    <button id="reset-characters-btn" type="button" class="btn btn-outline btn-small" data-i18n="toolbar.resetAll">キャラクターを全リセット</button>
    <button id="roster-history-btn" type="button" class="btn btn-outline btn-small" data-i18n="toolbar.rosterHistory">編成履歴から選ぶ</button>
  </div>

  <main class="panel character-list" id="character-list"></main>

  <div class="options-row">
    <label class="checkbox"><input type="checkbox" id="no-duplicate"><span data-i18n="options.noDuplicate">ジョブ重複なし</span></label>
    <label class="checkbox"><input type="checkbox" id="exclude-unreleased" checked><span data-i18n="options.excludeUnreleased">未開放ジョブを除外</span></label>
  </div>

  <button id="draw-button" class="btn btn-primary btn-large" data-i18n="draw.button">抽選開始</button>
  <button id="share-button" class="btn btn-outline btn-large" hidden data-i18n="draw.shareButton">結果をシェア</button>
  <p id="draw-error" class="error" hidden></p>
  <p id="share-message" class="notice" hidden></p>

  <footer class="footer">
    ©SQUARE ENIX CO., LTD. All Rights Reserved.<br>
    FINAL FANTASY XIV is a registered trademark of Square Enix Holdings Co., Ltd.<br>
    Tool by MigiteniEdamame
  </footer>
</div>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div id="modal" class="modal"></div>
</div>

<script src="../js/i18n.js"></script>
<script src="js/jobs.js"></script>
<script src="js/roles.js"></script>
<script src="js/worlds.js"></script>
<script src="js/draw.js"></script>
<script src="js/lodestone.js"></script>
<script src="js/mame-api.js"></script>
<script src="js/storage.js"></script>
<script src="js/share.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
