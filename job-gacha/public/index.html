<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジョブガチャ | FFXIV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="panel header">
    <div class="level-field">
      <label for="level-threshold">れべる</label>
      <input id="level-threshold" type="number" min="1" max="100" value="100">
    </div>

    <div class="header-center">
      <h1 class="title">ジョブガチャ</h1>
      <div class="role-icons" id="role-icons"></div>
    </div>

    <button id="role-mode-toggle" class="btn btn-outline">構成変更</button>
  </header>

  <main class="panel character-list" id="character-list"></main>

  <div class="options-row">
    <label class="checkbox"><input type="checkbox" id="no-duplicate">ジョブ重複なし</label>
    <label class="checkbox"><input type="checkbox" id="exclude-unreleased" checked>未開放ジョブを除外</label>
  </div>

  <button id="draw-button" class="btn btn-primary btn-large">抽選開始</button>
  <p id="draw-error" class="error" hidden></p>

  <footer class="footer">
    ©SQUARE ENIX CO., LTD. All Rights Reserved.<br>
    FINAL FANTASY XIV is a registered trademark of Square Enix Holdings Co., Ltd.<br>
    Tool by MigiteniEdamame
  </footer>
</div>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div id="modal" class="modal"></div>
</div>

<script src="js/jobs.js"></script>
<script src="js/roles.js"></script>
<script src="js/draw.js"></script>
<script src="js/lodestone.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
