<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>まめツール 管理</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%AB%9B%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="../job-gacha/css/style.css">
</head>
<body>
<div class="app">
  <header class="panel header admin-header">
    <a href="../" class="hub-link">← まめツール</a>
    <h1 class="title">管理ページ</h1>
  </header>

  <div id="login-panel" class="panel admin-panel">
    <p>Admin Key を入力してください</p>
    <div class="search-form-row">
      <input id="admin-key-input" type="password" placeholder="Admin Key">
      <button id="admin-login-btn" type="button" class="btn btn-primary">ログイン</button>
    </div>
    <p id="admin-login-error" class="error" hidden></p>
  </div>

  <div id="admin-content" class="admin-content" hidden>
    <div class="panel admin-panel">
      <h2 class="admin-section-title">ツール一覧</h2>
      <div id="tools-list" class="admin-tools-list"></div>
    </div>

    <div id="tool-details"></div>

    <button id="admin-logout-btn" type="button" class="btn btn-outline btn-small">ログアウト</button>
  </div>
</div>

<script src="../js/mame-api.js"></script>
<script src="admin.js"></script>
</body>
</html>
